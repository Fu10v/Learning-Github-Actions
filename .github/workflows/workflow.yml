name: CI tests
on:
  pull_request: 
    branches: [ "develop" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo Hello, GitHub Actions!
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest --cov=myapp --cov-fail-under=70 --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Add status badge to README if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BADGE="![Workflow Status](https://github.com/${{ github.repository }}/actions/workflows/workflow.yml/badge.svg)"
          if ! grep -q "badge.svg" README.md; then
            echo "There is no badge. Add it to the beginning of the file..."
            echo -e "$BADGE\n\n$(cat README.md)" > README.md
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: add workflow status badge to README"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Badge already exists in README.md. Skipping update."
          fi
